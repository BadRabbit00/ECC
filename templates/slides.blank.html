<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Название презентации</title>
<!--
  BR slides template v2. One file per deck. Installed at ~/.claude/br/templates/slides.html.

  slides.html       — this file: every slide type with an example (read it to see the markup).
  slides.blank.html — the same file with an empty <main>; the presenter copies it and replaces the SLIDES placeholder comment.
  The presenter changes ONLY <title>, data-topic on <body>, and the slides inside <main>.
  <style> and <script> stay byte-for-byte unchanged.

  Slide types (data-type): title, bullets, diagram, compare, table, before-after, decision, metrics, questions.
  Every slide: data-section = short section name (shown as "NN / SECTION"), one idea, ≤ 40 words or one diagram/table.

  Controls: ←/→, Space, PageUp/PageDown, Home/End, click left/right half, swipe. F = fullscreen. Slide number in #hash.
  Print / PDF: one slide per 1600×900 page, everything in its final state.
  Diagrams: mermaid from CDN (pinned). Offline, the diagram source stays visible as text.
-->
<style>
  :root {
    --paper: #FAF8F3; --card: #FFFFFF; --ink: #1E1B24; --muted: #5F5B6B; --line: rgba(30, 27, 36, .14);
    --accent: #6A3FD6; --accent-soft: #EEE8FD;
    --a: #2F6FD6; --a-soft: #E6EEFB;        /* entity A in comparisons, same on every slide */
    --b: #C2572D; --b-soft: #F8E9E2;        /* entity B */
    --good: #1F7A47; --bad: #B23A28;
    --ease-out: cubic-bezier(.22, .61, .36, 1);
    --font: "Golos Text", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #1B1A1F; color: var(--ink); font-family: var(--font); overflow: hidden;
         -webkit-font-smoothing: antialiased; }

  /* ---------- deck: one 16:9 stage, sizes in cqw ---------- */
  main { position: fixed; inset: 0; display: grid; place-items: center; }
  .slide { position: absolute; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9;
           container-type: inline-size; overflow: hidden; visibility: hidden;
           background-color: var(--paper);
           background-image: radial-gradient(rgba(30, 27, 36, .07) .09cqw, transparent .1cqw);
           background-size: 1.8cqw 1.8cqw; }
  .slide.active { visibility: visible; }
  .frame { position: absolute; inset: 0; padding: 3.2cqw 4cqw 3.6cqw; display: flex; flex-direction: column; }
  .meta { display: flex; justify-content: space-between; gap: 2cqw; padding-bottom: .9cqw;
          border-bottom: .07cqw solid var(--line); font-size: .95cqw; letter-spacing: .14em;
          text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta b { color: var(--accent); font-weight: 600; }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: 1.6cqw;
          padding-top: 3cqw; }

  h1 { font-size: 4.6cqw; line-height: 1.08; letter-spacing: -.02em; font-weight: 700; margin: 0;
       max-width: 22ch; text-wrap: balance; }
  h2 { font-size: 2.9cqw; line-height: 1.15; letter-spacing: -.015em; font-weight: 650; margin: 0;
       max-width: 30ch; text-wrap: balance; }
  h3 { font-size: 1.45cqw; line-height: 1.25; font-weight: 600; margin: 0 0 .6cqw; }
  p, li, td, th, dd, dt { font-size: 1.45cqw; line-height: 1.5; }
  p { margin: 0; max-width: 60ch; }
  .lead { font-size: 1.75cqw; color: var(--muted); max-width: 48ch; }
  .muted { color: var(--muted); }
  .small { font-size: 1.15cqw; }
  code { font-family: var(--mono); font-size: .92em; background: var(--accent-soft); padding: .05em .35em;
         border-radius: .35cqw; }
  ul, ol { margin: 0; padding-left: 1.6cqw; }
  li { margin: 0 0 .5cqw; }

  /* chips: the default way to show theses */
  .chips { display: flex; flex-wrap: wrap; gap: .9cqw; list-style: none; padding: 0; max-width: 78cqw; }
  .chips li { margin: 0; padding: .7cqw 1.3cqw; border-radius: 99cqw; background: var(--card);
              border: .07cqw solid var(--line); font-size: 1.4cqw; }
  .chips li b { color: var(--accent); font-weight: 600; }

  .cols { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 1.6cqw; }
  .box { background: var(--card); border: .07cqw solid var(--line); border-radius: .8cqw; padding: 1.6cqw 1.8cqw; }
  .box.pick { border: .16cqw solid var(--accent); }
  .box.a { border-top: .35cqw solid var(--a); } .box.b { border-top: .35cqw solid var(--b); }
  .box.before h3 { color: var(--bad); } .box.after h3 { color: var(--good); }
  .tag { display: inline-block; font-size: .95cqw; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
         padding: .25cqw .8cqw; border-radius: 99cqw; background: var(--accent); color: #fff; margin-bottom: .8cqw; }
  .note { font-size: 1.2cqw; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .7cqw .9cqw; border-bottom: .07cqw solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 1.15cqw; letter-spacing: .06em; text-transform: uppercase; }
  td { font-size: 1.3cqw; }

  .diagram { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .mermaid { margin: 0; font-family: var(--mono); font-size: 1.1cqw; white-space: pre; color: var(--muted);
             max-height: 100%; overflow: hidden; }
  .mermaid[data-processed="true"] { white-space: normal; color: inherit; width: 100%; height: 100%;
                                    display: flex; align-items: center; justify-content: center; }
  .mermaid svg { max-width: 100%; max-height: 100%; height: auto; }

  dl.decision { display: grid; grid-template-columns: 14cqw 1fr; gap: 1cqw 2cqw; margin: 0; }
  dl.decision dt { color: var(--muted); font-size: 1.15cqw; letter-spacing: .08em; text-transform: uppercase;
                   padding-top: .25cqw; }
  dl.decision dd { margin: 0; }

  .metrics { display: grid; gap: 1.2cqw; }
  .metric { display: grid; grid-template-columns: 22cqw 1fr 9cqw; align-items: center; gap: 1.6cqw; }
  .metric .bar { height: 1.6cqw; background: var(--accent-soft); border-radius: .3cqw; overflow: hidden; }
  .metric .bar i { display: block; height: 100%; width: var(--v); background: var(--accent);
                   transform-origin: left center; }
  .metric .bar.a i { background: var(--a); } .metric .bar.b i { background: var(--b); }
  .metric > span { font-size: 1.4cqw; }
  .metric .val { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 1.5cqw; }

  ol.questions { counter-reset: q; list-style: none; padding: 0; display: grid; gap: 1.1cqw; }
  ol.questions li { counter-increment: q; display: grid; grid-template-columns: 3.4cqw 1fr; margin: 0; }
  ol.questions li::before { content: counter(q, decimal-leading-zero); color: var(--accent); font-weight: 600;
                            font-variant-numeric: tabular-nums; }
  ol.questions .def { grid-column: 2; color: var(--muted); font-size: 1.2cqw; }

  .slide[data-type="title"] .body { justify-content: flex-end; padding: 0 0 4cqw; }
  .slide[data-type="title"] h1 { font-size: 5.4cqw; }

  /* ---------- reveal on enter ---------- */
  .slide.active .body > * { animation: rise .44s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 60ms); }
  .slide.active .metric .bar i { animation: grow .7s var(--ease-out) both; animation-delay: .25s; }
  @keyframes rise { from { opacity: 0; transform: translateY(1cqw); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    .slide.active .body > * { animation-name: fade; }
    .slide.active .metric .bar i { animation: none; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  }

  /* ---------- chrome ---------- */
  #progress { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0;
              transition: width .3s var(--ease-out); z-index: 3; }
  #counter { position: fixed; right: 14px; bottom: 10px; font: 500 13px/1 var(--font); color: #B9B6C2;
             font-variant-numeric: tabular-nums; z-index: 3; }
  #controls { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px;
              opacity: 0; transition: opacity .25s; z-index: 4; }
  #controls.show { opacity: 1; }
  #controls button { font: 500 13px/1 var(--font); color: #fff; background: rgba(30, 27, 36, .82);
                     border: 1px solid rgba(255, 255, 255, .15); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  :fullscreen #controls { display: none; }
  @media (hover: hover) and (pointer: fine) { #controls button:hover { background: var(--accent); } }

  /* ---------- print: one slide per page, final state ---------- */
  @page { size: 1600px 900px; margin: 0; }
  @media print {
    body { background: none; overflow: visible; height: auto; }
    main { position: static; display: block; }
    .slide { position: relative; visibility: visible; width: 1600px; height: 900px; aspect-ratio: auto;
             break-after: page; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    .slide .body > *, .slide .metric .bar i { animation: none !important; opacity: 1 !important; transform: none !important; }
    #progress, #counter, #controls { display: none; }
  }
</style>
</head>
<body data-topic="Проект «Название» · Архитектура">
<main>
<!-- SLIDES -->
</main>
<div id="progress"></div>
<div id="counter"></div>
<div id="controls">
  <button type="button" data-go="-1" aria-label="Назад">←</button>
  <button type="button" data-go="1" aria-label="Вперёд">→</button>
  <button type="button" data-full aria-label="Полный экран">F</button>
</div>
<script type="module">
  const slides = [...document.querySelectorAll('main > .slide')];
  const topic = document.body.dataset.topic || document.title;
  const pad = (n) => String(n).padStart(2, '0');

  // Wrap each slide: service line + body. Presenter writes only the content.
  slides.forEach((s, k) => {
    const frame = document.createElement('div');
    frame.className = 'frame';
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `<span><b>${pad(k + 1)}</b> / ${s.dataset.section || ''}</span><span></span>`;
    meta.lastElementChild.textContent = topic;
    const body = document.createElement('div');
    body.className = 'body';
    [...s.childNodes].forEach((n) => body.appendChild(n));
    [...body.children].forEach((el, i) => el.style.setProperty('--i', i));
    frame.append(meta, body);
    s.appendChild(frame);
  });

  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  let cur = 0;
  const fromHash = () => Math.min(slides.length, Math.max(1, parseInt(location.hash.slice(1), 10) || 1)) - 1;
  function show(i, push = true) {
    cur = Math.min(slides.length - 1, Math.max(0, i));
    slides.forEach((s, k) => s.classList.toggle('active', k === cur));
    counter.textContent = `${pad(cur + 1)} / ${pad(slides.length)}`;
    progress.style.width = `${((cur + 1) / slides.length) * 100}%`;
    if (push) history.replaceState(null, '', `#${cur + 1}`);
  }
  const go = (d) => show(cur + d);
  const toggleFull = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  };

  addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(k)) { e.preventDefault(); go(1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(k)) { e.preventDefault(); go(-1); }
    else if (k === 'Home') show(0);
    else if (k === 'End') show(slides.length - 1);
    else if (k === 'f' || k === 'F' || k === 'а' || k === 'А') toggleFull();
  });
  document.querySelector('main').addEventListener('click', (e) => {
    if (e.target.closest('a, button, summary')) return;
    go(e.clientX < innerWidth / 2 ? -1 : 1);
  });
  let x0 = null;
  addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
    x0 = null;
  });
  addEventListener('hashchange', () => show(fromHash(), false));

  const controls = document.getElementById('controls');
  let hideT;
  addEventListener('mousemove', () => {
    controls.classList.add('show');
    clearTimeout(hideT);
    hideT = setTimeout(() => controls.classList.remove('show'), 1800);
  });
  controls.addEventListener('click', (e) => {
    e.stopPropagation();
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.full !== undefined) toggleFull(); else go(Number(b.dataset.go));
  });

  // Render diagrams while every slide is laid out, then switch to one-slide mode.
  slides.forEach((s) => s.classList.add('active'));
  try {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs');
    const css = getComputedStyle(document.documentElement);
    const v = (n) => css.getPropertyValue(n).trim();
    mermaid.initialize({
      startOnLoad: false, theme: 'base', securityLevel: 'strict',
      themeVariables: {
        fontFamily: v('--font'), primaryColor: v('--accent-soft'), primaryBorderColor: v('--accent'),
        primaryTextColor: v('--ink'), lineColor: v('--muted'), secondaryColor: v('--a-soft'),
        tertiaryColor: v('--b-soft'), background: v('--paper'),
      },
    });
    await mermaid.run({ querySelector: '.mermaid' });
  } catch (err) {
    console.warn('mermaid did not load; diagrams stay as text', err);
  }
  show(fromHash(), false);
</script>
</body>
</html>
